server {
    listen 80;
    root /usr/share/nginx/html;
    location /api/ { proxy_pass http://collector:8000; }
    location /healthz { proxy_pass http://collector:8000; }
    # Vendor libs change only on manual upgrade: cache 7 days.
    location /vendor/ { add_header Cache-Control "public, max-age=604800"; }
    # Everything else (html/js/css): no-cache = store but revalidate every
    # request, so deploys show up on next load via cheap ETag/304s. Without
    # this, browsers heuristically cache ES modules and can run stale JS for
    # hours after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
